# Creates a GitHub release with the built mod jar whenever a version tag
# (v1.0.0, v1.2.3, ...) is pushed.
#
# How to release:
#   1. Set `version=X.Y.Z` in gradle.properties and commit.
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
#   3. This workflow builds the jar and publishes the release automatically.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check that the tag matches gradle.properties
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "Tag version:     $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$PROJECT_VERSION in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect release files
        id: files
        run: |
          ls -la build/libs
          MOD_JAR="$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)"
          SOURCES_JAR="$(ls build/libs/*-sources.jar | head -n 1 || true)"
          test -f "$MOD_JAR"
          echo "mod_jar=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$SOURCES_JAR" >> "$GITHUB_OUTPUT"
          (cd build/libs && sha256sum *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Write release notes
        run: |
          MC_VERSION="$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          LOADER_VERSION="$(grep -E '^loader_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          FABRIC_API_VERSION="$(grep -E '^fabric_api_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          MOD_JAR_NAME="$(basename '${{ steps.files.outputs.mod_jar }}')"
          cat > release-notes.md <<EOF
          ## SafeAnchor ${GITHUB_REF_NAME}

          Client-seitige Fabric-Mod für eine kontrollierte, einmalige Safe-Anchor-Sequenz.

          ### Installation
          1. [Fabric Loader](https://fabricmc.net/use/) für Minecraft **${MC_VERSION}** installieren (mind. ${LOADER_VERSION}).
          2. [Fabric API](https://modrinth.com/mod/fabric-api) **${FABRIC_API_VERSION}** in den \`mods\`-Ordner legen.
          3. **\`${MOD_JAR_NAME}\`** (unten) ebenfalls in den \`mods\`-Ordner legen.

          Die Mod ist rein client-seitig, der Server braucht nichts. Java 21 wird benötigt.

          ### Dateien
          | Datei | Zweck |
          |---|---|
          | \`${MOD_JAR_NAME}\` | **Die Mod** – in den \`mods\`-Ordner |
          | \`*-sources.jar\` | Quellcode (nur für Entwickler) |
          | \`SHA256SUMS.txt\` | Prüfsummen |

          > ⚠️ Fair Play: Nur dort nutzen, wo Automatisierung erlaubt ist.
          EOF
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("${{ steps.files.outputs.mod_jar }}" build/libs/SHA256SUMS.txt)
          if [ -n "${{ steps.files.outputs.sources_jar }}" ]; then
            FILES+=("${{ steps.files.outputs.sources_jar }}")
          fi
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SafeAnchor $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
